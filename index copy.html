<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div id="app"></div>
    <div class="container my-5">
        <div class="row gy-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <div class="mb-3 input-group mt-3">
                            <input type="text" placeholder="Enter New To-Do" class="form-control" id="todoInput" autocomplete="off">
                            <button type="type" class="input-group-text btn btn-primary" id="addButton">ADD</button>
                        </div>
                    </div>

                    <div class="card-body" id="toDoList"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Completed Task</h5>
                    </div>
                    <div class="card-body" id="completedList"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
